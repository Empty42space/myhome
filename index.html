<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Новая Вкладка</title>
    <style>
        :root {
            --card-bg: rgba(20, 20, 25, 0.4);
            --text-color: #f0e2e5;
            --border-normal: rgba(100, 100, 110, 0.25);
            --border-hover: rgba(140, 140, 150, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ПОЛНОЭКРАННЫЕ ОБОИ */
        .welcome-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
            user-select: none;
        }

        /* Затемняющий слой для глубины */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(15, 15, 20, 0.4) 0%, rgba(25, 25, 30, 0.3) 100%);
            z-index: -1;
        }

        /* Сетка с кнопками сайтов */
        .grid-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 900px;
            padding: 20px;
            z-index: 1;
        }

        /* КАРТОЧКА-КОНТЕЙНЕР */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-normal);
            border-radius: 24px;
            width: 170px;
            height: 150px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(4px);
        }

        /* ПЛАВНОЕ ПРИПОДНИМАНИЕ ПРИ НАВЕДЕНИИ */
        .card:hover {
            transform: translateY(-6px);
            border-color: var(--border-hover);
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.8);
        }

        /* КАРТИНКА НА ВЕСЬ КОНТЕЙНЕР КАРТОЧКИ */
        .card-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        /* ТЕМНЫЙ СЛОЙ ПОВЕРХ КАРТИНКИ ДЛЯ ТЕКСТА */
        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(10, 10, 15, 0.85) 0%, rgba(10, 10, 15, 0.2) 100%);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.4s ease;
        }

        .card:hover .card-overlay {
            background: linear-gradient(to top, rgba(10, 10, 15, 0.9) 0%, rgba(20, 20, 25, 0.4) 100%);
        }

        /* НАЗВАНИЕ САЙТА ПОВЕРХ КАРТИНКИ */
        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
            z-index: 4;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <!-- ОБОИ -->
    <img src="https://ibb.co" class="welcome-img" alt="Background">
    <div class="bg-overlay"></div>

    <!-- Плитки быстрого доступа -->
    <div class="grid-container">
        
        <a href="https://youtube.com" class="card">
            <img src="https://ibb.co" class="card-img" alt="YouTube">
            <div class="card-overlay">
                <div class="card-title">YouTube</div>
            </div>
        </a>

        <a href="https://pinterest.com" class="card">
            <img src="https://ibb.co" class="card-img" alt="Pinterest">
            <div class="card-overlay">
                <div class="card-title">Pinterest</div>
            </div>
        </a>

        <a href="https://edu22.info" class="card">
            <img src="https://ibb.co" class="card-img" alt="Edu22">
            <div class="card-overlay">
                <div class="card-title">Edu22</div>
            </div>
        </a>

        <a href="https://github.com" class="card">
            <img src="https://ibb.co" class="card-img" alt="GitHub">
            <div class="card-overlay">
                <div class="card-title">GitHub</div>
            </div>
        </a>

    </div>

</body>
</html>
